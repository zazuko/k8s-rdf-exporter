name: Run tests

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Lint & build

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run linter and type checker
        run: npm test

  integration:
    name: Integration tests (k3s)

    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start a k3s cluster
        run: |
          curl -sfL https://get.k3s.io \
            | INSTALL_K3S_CHANNEL=stable \
              INSTALL_K3S_EXEC="--write-kubeconfig-mode=644" \
              sh -

      - name: Wait for the cluster to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=180s
          kubectl cluster-info

      - name: Run integration tests
        run: npm run test:integration

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get all --all-namespaces || true
          kubectl -n k8s-rdf-exporter-test describe all || true
          sudo journalctl -u k3s --no-pager -n 200 || true
